{{/*
  Single Deployment with one container per poller slot.
  Each container gets HOSTNAME set to "simp-poller-N" so the poller
  auto-detects its id from the trailing ordinal.
  To scale: change poller.replicas in values.yaml and redeploy.
*/}}
{{- $total := .Values.poller.replicas | int }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simp-poller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simp-poller
  template:
    metadata:
      labels:
        app: simp-poller
    spec:
      containers:
        {{- range $i, $_ := until $total }}
        - name: poller-{{ $i }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          env:
            - name: HOSTNAME
              value: "simp-poller-{{ $i }}"
            - name: SIMP_TOTAL_POLLERS
              value: "{{ $total }}"
          args:
            - perl
            - /usr/bin/simp_poller.pl
            - --config
            - /etc/simp/config.xml
            - --logging
            - /etc/simp/logging.conf
            - --nofork
          volumeMounts:
            - name: simp-config
              mountPath: /etc/simp
        {{- end }}
      volumes:
        - name: simp-config
          configMap:
            name: simp-config
