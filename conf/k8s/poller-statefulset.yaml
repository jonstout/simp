apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simp-poller
  namespace: simp
spec:
  serviceName: simp-poller
  # When scaling, update replicas and SIMP_TOTAL_POLLERS together and redeploy.
  replicas: {{ .Values.poller.replicas }}
  selector:
    matchLabels:
      app: simp-poller
  template:
    metadata:
      labels:
        app: simp-poller
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: simp-poller

      containers:
        - name: poller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            # poller_id is auto-detected from the pod hostname ordinal at startup.
            # total_pollers must match .spec.replicas above.
            - name: SIMP_TOTAL_POLLERS
              value: "{{ .Values.poller.replicas }}"
          args:
            - perl
            - /usr/bin/simp.pl
            - --config
            - /etc/simp/config.xml
            - --logging
            - /etc/simp/logging.conf
            - --nofork
          volumeMounts:
            - name: simp-config
              mountPath: /etc/simp
          terminationGracePeriodSeconds: 30

      volumes:
        - name: simp-config
          configMap:
            name: simp-config

---
apiVersion: v1
kind: Service
metadata:
  name: simp-poller
  namespace: simp
spec:
  clusterIP: None
  selector:
    app: simp-poller
